[project]
name = "indigent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.0", "pydantic-settings>=2.0",
  "aiosqlite>=0.20", "sse-starlette>=2.0", "python-multipart>=0.0.9", "docker>=7.0",
  "python-docx>=1.1", "openpyxl>=3.1", "Pillow>=10.0", "httpx>=0.27",
  # app/rag/production.py imports fitz for local PDF text extraction; it was only
  # working because requirements.lock happened to carry it, so a fresh install of
  # this project produced an install that failed at runtime on every PDF.
  "pymupdf>=1.24"
]

[project.optional-dependencies]
# Dev/test toolchain only: nothing under app/ may import any of these.
#
# `make setup` does NOT read this section -- it installs requirements.lock, which is
# generated to already contain this closure, so a clean venv can run `make test` and
# `ruff check .` without a second command. This section exists so `pip install -e
# ".[dev]"` and IDE resolution agree with the lock rather than diverging from it.
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.16",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["docker: requires Docker", "needs_models: requires Joy's real modules and local models"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B006"]
